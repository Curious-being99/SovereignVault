image: reactnativecommunity/react-native-android:latest

stages:
  - test
  - build

test_job:
  stage: test
  script:
    - echo "Skipping tests"

build_android:
  stage: build
  script:
    - npm install
    - npm run build
    - npx cap sync android
    - cd android
    - chmod +x gradlew
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
