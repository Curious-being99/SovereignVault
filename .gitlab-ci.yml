image: node:22

stages:
  - test
  - build

before_script:
  - apt-get update
  - apt-get install -y python3 make g++ openjdk-17-jdk curl
  - mkdir -p android/gradle/wrapper
  - curl -L https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar


test_job:
  stage: test
  script:
    - echo "Skipping tests"

build_android:
  stage: build
  image: openjdk:17-slim
  before_script:
    - apt-get update && apt-get install -y curl unzip
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - export ANDROID_SDK_ROOT="/opt/android-sdk"
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
    - unzip commandlinetools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses
    - sdkmanager "platforms;android-34" "build-tools;34.0.0"
  script:
    - npm ci
    - npm run build
    - npx cap sync android
    - cd android
    - chmod +x gradlew
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
