image: node:22

stages:
  - build

build_android:
  stage: build
  variables:
    ANDROID_SDK_ROOT: "/opt/android-sdk"
  before_script:
    - apt-get update && apt-get install -y curl unzip python3 make g++ openjdk-17-jdk git
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - unzip commandlinetools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-36" "platforms;android-34" "build-tools;34.0.0"
  script:
    - npm install
    - npm run build
    - npx cap sync android
    - cd android
    - curl -L https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
    - chmod +x gradlew
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week
