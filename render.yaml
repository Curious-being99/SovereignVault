# Render Blueprint Specification (render.yaml)
# To deploy, connect your repository to Render (https://render.com) and import this blueprint.
#
# Defaults to Render's 100% Free Plan with Ephemeral Storage (No Setup / No Paid Card Required).
# If you decide to upgrade to a paid Starter plan later to keep your vault data persistent 
# across restarts, simply uncomment the 'disk' and 'DATABASE_PATH' lines below.

services:
  - type: web
    name: sovereign-vault
    runtime: node
    plan: free # Change to 'starter' if you want to use persistent disks
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Points the SQLite database file to the persistent mount path
      # Uncomment this only if using a persistent disk (requires paid plan)
      # - key: DATABASE_PATH
      #   value: /var/data/vault.db

      # Generates a high-entropy master encryption key automatically on deployment
      - key: VAULT_DB_KEY
        generateValue: true

      # The external URL of your web service on Render (e.g., https://your-subdomain.onrender.com)
      # You can copy and paste the Render service URL here after creation.
      - key: APP_URL
        sync: false

    # Paid Plan Feature (Requires 'starter' plan or higher):
    # Uncomment the disk configuration below if you want persistent storage.
    # disk:
    #   name: sovereign-vault-data
    #   mountPath: /var/data
    #   sizeGB: 1

