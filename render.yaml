# Render Blueprint Specification (render.yaml)
# To deploy, connect your repository to Render (https://render.com) and import this blueprint.
#
# Configured for Render's 100% Free Plan (No credit card or payment required).
# Note: On the free plan, database storage is ephemeral (data resets when the app redeploys or restarts).

services:
  - type: web
    name: sovereign-vault
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Generates a high-entropy master encryption key automatically on deployment
      - key: VAULT_DB_KEY
        generateValue: true



