<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Mature Professional Blue Palette -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>
    
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="metalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Vault Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#metalBlue)" stroke-width="40" />
  
  <!-- Inner Vault Door -->
  <circle cx="256" cy="256" r="140" fill="url(#metalBlue)" stroke="#1e1b4b" stroke-width="4" />
  
  <!-- Central Dial Mechanism -->
  <circle cx="256" cy="256" r="80" fill="url(#metalSilver)" stroke="#4338ca" stroke-width="2" />
  
  <!-- Dial Notches -->
  <g stroke="#312e81" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="186" x2="256" y2="200" />
    <line x1="256" y1="312" x2="256" y2="326" />
    <line x1="186" y1="256" x2="200" y2="256" />
    <line x1="312" y1="256" x2="326" y2="256" />
    
    <g transform="rotate(45, 256, 256)">
      <line x1="256" y1="186" x2="256" y2="200" />
      <line x1="256" y1="312" x2="256" y2="326" />
      <line x1="186" y1="256" x2="200" y2="256" />
      <line x1="312" y1="256" x2="326" y2="256" />
    </g>
  </g>

  <!-- Central Security Keyhole / Node (Reversed) -->
  <circle cx="256" cy="256" r="30" fill="#ffffff" />
  <text x="256" y="272" text-anchor="middle" fill="#1e1b4b" font-family="sans-serif" font-size="48" font-weight="900">R</text>
  
  <!-- Subtle Reflection -->
  <path d="M 120,200 A 180,180 0 0 1 200,120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.1" stroke-linecap="round" />
</svg>
